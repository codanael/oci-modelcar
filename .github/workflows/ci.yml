name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 is supported per requires-python (>=3.11) and tested
        # locally, but the GitHub runner image's combination of
        # python-3.14 + werkzeug + pytest-httpserver hangs on small HTTP
        # responses (urllib3 connectionpool.py:534 → http.client _read_status
        # blocks on recv_into). Reinclude when the upstream compat is
        # restored.
        python-version: ["3.11", "3.12", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest -m "not e2e" --cov=oci_modelcar --cov-report=term
