repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: mypy --strict src/
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (not e2e)
        entry: pytest -m "not e2e" -q
        language: system
        pass_filenames: false
        stages: [pre-commit]
